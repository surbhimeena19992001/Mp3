/* MONOCHROME EDITION — editorial black & white, polished contemporary UI */
:root{--bg:#080808;--panel:#141414;--panel2:#222;--text:#f7f7f7;--muted:#a1a1a1;--accent:#fff;--accent2:#bdbdbd;--line:#303030;--danger:#e5e5e5}
body{background:radial-gradient(ellipse at 75% -10%,#ffffff12,transparent 34%),radial-gradient(ellipse at 0% 40%,#ffffff08,transparent 30%),var(--bg);color:var(--text)}
.sidebar{background:#080808e8;border-right-color:#ffffff15}
.logo{background:#fff;color:#090909;box-shadow:0 0 28px #ffffff14}
.brand span span{color:#fff!important}
.navlabel{color:#777}
.nav button:hover,.nav button.active{background:#ffffff0c;color:#fff}
.nav button.active .ico,.eyebrow,.text-btn{color:#fff}
.side-bottom{background:linear-gradient(145deg,#222,#111);border-color:#333}
.small-btn,.primary,.chip.active,.player-actions .bigplay,.cover .play-overlay,.toast{background:#fff;color:#080808}
.hero{background:linear-gradient(115deg,#202020 0%,#101010 58%,#303030 100%);border-color:#3b3b3b}
.hero:before,.hero:after{border-color:#ffffff16}
.pill{background:#ffffff12;color:#fff;border:1px solid #ffffff18}
.hero p{color:#c2c2c2}
.disc{background:repeating-radial-gradient(circle at center,#080808 0 5px,#353535 6px 8px);box-shadow:0 20px 45px #0009}
.disc:before{background:linear-gradient(135deg,#fff,#777);border-color:#181818}
.disc:after{background:#111}
.search input{background:#111;border-color:#333}
.iconbtn{background:#151515;border-color:#333}
.avatar{background:linear-gradient(135deg,#fff,#888);color:#080808}
.music-card:hover,.track-row:hover,.track-row.current{background:#171717}
.cover{filter:saturate(0);border:1px solid #ffffff12}

</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">♫</div><span>vega<span style="color:var(--accent)">music</span></span></div><div><div class="navlabel">MENU</div><nav class="nav" id="sideNav"><button class="active" data-page="home"><span class="ico">⌂</span><span class="label">Home</span></button><button data-page="search"><span class="ico">⌕</span><span class="label">Search</span></button><button data-page="library"><span class="ico">▤</span><span class="label">Your Library</span></button><button data-page="playlists"><span class="ico">▧</span><span class="label">Playlists</span></button></nav></div><div><div class="navlabel">YOUR COLLECTION</div><nav class="nav"><button data-filter="liked"><span class="ico">♥</span><span class="label">Liked Songs</span></button><button id="importSide"><span class="ico">＋</span><span class="label">Import music</span></button></nav></div><div class="side-bottom"><div style="font-weight:800;font-size:13px">Your music. Your rules.</div><p>Play audio files from your device. Your files stay on your device.</p><button class="small-btn" id="importCard">＋ Add music</button></div></aside>
<main class="main"><header class="topbar"><div class="search"><span>⌕</span><input id="searchInput" placeholder="Search songs, artists..." autocomplete="off"></div><div class="top-actions"><button class="iconbtn" id="importTop" title="Import music">＋</button><button class="iconbtn" id="themeBtn" title="Change accent">◐</button><div class="avatar">V</div></div></header><div id="page"></div></main></div>
<div class="playerbar"><div class="now-playing"><div id="nowCover" class="now-cover" style="background:linear-gradient(135deg,#43345b,#b87fc5)">♫</div><div class="now-text"><strong id="nowTitle">Choose a song</strong><span id="nowArtist">Import MP3 files to begin</span></div><button class="heart" id="nowLike" title="Like song">♡</button></div><div><div class="player-actions"><button id="shuffleBtn" title="Shuffle">⤨</button><button id="prevBtn" title="Previous">◀|</button><button class="bigplay" id="playBtn" title="Play">▶</button><button id="nextBtn" title="Next">|▶</button><button id="repeatBtn" title="Repeat">↻</button></div><div class="timeline"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><div class="player-right"><span>◖</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8"><button class="iconbtn" id="queueBtn" title="Queue">☷</button></div></div>
<nav class="mobile-nav" id="mobileNav"><button class="active" data-page="home"><span class="ico">⌂</span>Home</button><button data-page="search"><span class="ico">⌕</span>Search</button><button data-page="library"><span class="ico">▤</span>Library</button><button data-page="playlists"><span class="ico">▧</span>Playlists</button></nav>
<input id="filePicker" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple class="hidden"><audio id="audio" preload="metadata"></audio><div class="toast" id="toast"></div><div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];const audio=$('#audio');let tracks=[],queue=[],current=-1,page='home',shuffle=false,repeat=false,searchQuery='',activeFilter='all',playlists=JSON.parse(localStorage.getItem('vega-playlists')||'[]'),liked=new Set(JSON.parse(localStorage.getItem('vega-liked')||'[]'));let objectUrls=[];const palettes=[['#111111','#555555','♫'],['#202020','#777777','☼'],['#080808','#444444','✦'],['#303030','#909090','◈'],['#181818','#666666','☀'],['#252525','#a0a0a0','✧'],['#101010','#858585','〰'],['#292929','#b0b0b0','❋']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){if(!Number.isFinite(n)||n<0)return'0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}function palette(t){return palettes[(t?.id||0)%palettes.length]}function art(t,cls='cover'){let p=palette(t);return `<div class="${cls}" style="background:linear-gradient(135deg,${p[0]},${p[1]})"><span class="${cls==='cover'?'cover-symbol':''}">${p[2]}</span></div>`}function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}function save(){localStorage.setItem('vega-liked',JSON.stringify([...liked]));localStorage.setItem('vega-playlists',JSON.stringify(playlists))}function duration(t){return fmt(t?.duration||0)}function addTracks(files){let added=0;[...files].forEach(file=>{if(!file.type.startsWith('audio/')&&!/\.(mp3|m4a|aac|wav|ogg|flac|opus)$/i.test(file.name))return;const url=URL.createObjectURL(file);objectUrls.push(url);const name=file.name.replace(/\.[^.]+$/,'');tracks.push({id:Date.now()+Math.random(),name,artist:'Local file',album:'Imported music',url,file,duration:0});added++});if(added){queue=tracks.map(t=>t.id);render();toast(`Added ${added} track${added===1?'':'s'} to your library`)}else toast('No supported audio files selected')}
function filtered(){let list=tracks;if(page==='search'||searchQuery){const q=searchQuery.toLowerCase();list=list.filter(t=>(t.name+' '+t.artist+' '+t.album).toLowerCase().includes(q))}if(activeFilter==='liked')list=list.filter(t=>liked.has(t.id));if(activeFilter==='recent')list=list.filter(t=>t.playedAt).sort((a,b)=>(b.playedAt||0)-(a.playedAt||0));if(activeFilter==='all'){}return list}
function row(t){let idx=tracks.findIndex(x=>x.id===t.id);return `<div class="track-row ${idx===current?'current':''}" data-track="${t.id}"><button class="mini-cover" style="background:linear-gradient(135deg,${palette(t)[0]},${palette(t)[1]})" data-play="${t.id}">${palette(t)[2]}</button><div class="track-meta" data-play="${t.id}" style="cursor:pointer"><strong>${esc(t.name)}</strong><span>${esc(t.artist||'Unknown artist')}</span></div><span class="duration">${duration(t)}</span><button class="heart ${liked.has(t.id)?'liked':''}" data-like="${t.id}">${liked.has(t.id)?'♥':'♡'}</button></div>`}
function card(t){return `<div class="music-card" data-track-card="${t.id}">${art(t)}<button class="play-overlay" data-play="${t.id}">▶</button><h4>${esc(t.name)}</h4><p>${esc(t.artist||'Unknown artist')}</p></div>`}
function empty(title,desc,button='Import music'){return `<div class="empty"><div style="font-size:25px;margin-bottom:8px">♫</div><strong style="color:var(--text)">${title}</strong><br>${desc}<br><button class="primary" data-import style="margin-top:14px">＋ ${button}</button></div>`}
function section(title,content,action=''){return `<div class="section-head"><h3>${title}</h3>${action?`<button class="text-btn" data-goto="${action}">See all ↗</button>`:''}</div>${content}`}
function home(){let recent=tracks.filter(t=>t.playedAt).sort((a,b)=>b.playedAt-a.playedAt).slice(0,4),popular=tracks.slice(0,4);return `<div class="welcome"><div><div class="eyebrow">YOUR PERSONAL SOUNDTRACK</div><h1>Good music.<br><span style="color:var(--accent)">Good mood.</span></h1><p>Your music, all in one place.</p></div><button class="primary" data-import>＋ Import music</button></div><section class="hero"><div class="hero-copy"><span class="pill">✦ YOUR SPACE, YOUR SOUND</span><h2>Every track has<br>a story.</h2><p>Bring your favorite songs together. Build playlists, discover your own library, and press play.</p><button class="primary" data-import>＋ Add your first tracks</button></div><div class="hero-art"><div class="disc"></div></div></section>${section('Quick picks',popular.length?`<div class="cards">${popular.map(card).join('')}</div>`:empty('Your library is waiting','Import MP3s or audio files from your device to start listening.'))}${recent.length?section('Recently played',`<div class="rowlist">${recent.map(row).join('')}</div>`):''}${tracks.length?section('All tracks',`<div class="rowlist">${tracks.slice(0,5).map(row).join('')}</div>`,'library'):''}`}
function library(){let list=filtered();return `<h1 class="page-title">Your Library</h1><p class="subtle">Your collection, organized your way.</p><div class="filters"><button class="chip ${activeFilter==='all'?'active':''}" data-filter="all">All tracks</button><button class="chip ${activeFilter==='liked'?'active':''}" data-filter="liked">♥ Liked songs</button><button class="chip ${activeFilter==='recent'?'active':''}" data-filter="recent">Recently played</button><button class="chip" data-import>＋ Import</button></div>${list.length?`<div class="rowlist">${list.map(row).join('')}</div>`:empty(activeFilter==='liked'?'No liked songs yet':'No tracks here yet',activeFilter==='liked'?'Tap the heart next to any song to save it here.':'Import music files to build your library.')}`}
function searchPage(){let list=filtered();return `<h1 class="page-title">Search</h1><p class="subtle">Find a song in your own music collection.</p>${list.length?`<div class="rowlist">${list.map(row).join('')}</div>`:empty(searchQuery?'No matching tracks':'Search your music','Try a song title, artist, or import local files.')}`}
function playlistPage(){return `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1 class="page-title">Playlists</h1><p class="subtle">Moods, moments, and everything in between.</p></div><button class="primary" id="newPlaylist">＋ Create</button></div>${playlists.length?`<div class="playlist-grid">${playlists.map((p,i)=>`<button class="playlist" data-pl="${i}"><div class="playlist-art" style="background:linear-gradient(135deg,${palettes[i%palettes.length][0]},${palettes[i%palettes.length][1]})">${['♫','☾','✦','☼'][i%4]}</div><strong>${esc(p.name)}</strong><span>${p.ids.length} songs · Open playlist ↗</span></button>`).join('')}</div>`:empty('Make it yours','Create playlists for every mood and moment.','Create playlist')}`}
function render(){let root=$('#page');if(page==='home')root.innerHTML=home();else if(page==='library')root.innerHTML=library();else if(page==='search')root.innerHTML=searchPage();else root.innerHTML=playlistPage();$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#searchInput').value=searchQuery;updatePlayer()}
function go(p){page=p;activeFilter='all';render()}function playTrack(id){let idx=tracks.findIndex(t=>t.id==id);if(idx<0)return;current=idx;tracks[idx].playedAt=Date.now();audio.src=tracks[idx].url;audio.play().then(()=>{$('#playBtn').textContent='Ⅱ';updatePlayer();renderPageRows()}).catch(()=>{updatePlayer();toast('Tap play to start this track')});updatePlayer()}
function renderPageRows(){const rows=$$('.track-row');rows.forEach(r=>r.classList.toggle('current',Number(r.dataset.track)===tracks[current]?.id))}function updatePlayer(){const t=tracks[current];$('#nowTitle').textContent=t?.name||'Choose a song';$('#nowArtist').textContent=t?.artist||'Import MP3 files to begin';$('#nowCover').style.background=t?`linear-gradient(135deg,${palette(t)[0]},${palette(t)[1]})`:'linear-gradient(135deg,#43345b,#b87fc5)';$('#nowCover').textContent=t?palette(t)[2]:'♫';$('#nowLike').textContent=t&&liked.has(t.id)?'♥':'♡';$('#nowLike').classList.toggle('liked',!!t&&liked.has(t.id));$('#playBtn').textContent=audio.paused?'▶':'Ⅱ';$('#shuffleBtn').classList.toggle('on',shuffle);$('#repeatBtn').classList.toggle('on',repeat)}function next(){if(!tracks.length)return;let i;if(shuffle&&tracks.length>1){do{i=Math.floor(Math.random()*tracks.length)}while(i===current)}else i=(current+1)%tracks.length;playTrack(tracks[i].id)}function prev(){if(!tracks.length)return;if(audio.currentTime>3){audio.currentTime=0;return}playTrack(tracks[(current-1+tracks.length)%tracks.length].id)}function toggleLike(id){if(liked.has(id))liked.delete(id);else liked.add(id);save();render()}
function openModal(html,setup){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('show');if(setup)setup()}function closeModal(){$('#modalBackdrop').classList.remove('show')}
function showPlaylist(i){const p=playlists[i];if(!p)return;const list=p.ids.map(id=>tracks.find(t=>t.id===id)).filter(Boolean);openModal(`<h3>${esc(p.name)}</h3><p>${list.length} tracks in this playlist</p><div class="rowlist">${list.map(row).join('')||'<div class="empty">No tracks in this playlist yet.</div>'}</div><div class="modal-actions"><button class="secondary" id="addToPlaylist">＋ Add tracks</button><button class="secondary" id="closeModal">Close</button></div>`,()=>{$('#closeModal').onclick=closeModal;$('#addToPlaylist').onclick=()=>{closeModal();openModal(`<h3>Add tracks</h3><p>Select songs to add to “${esc(p.name)}”.</p><div class="rowlist">${tracks.map(t=>`<label class="track-row"><input type="checkbox" data-pltrack="${t.id}" ${p.ids.includes(t.id)?'checked':''}><div class="track-meta"><strong>${esc(t.name)}</strong><span>${esc(t.artist)}</span></div></label>`).join('')}</div><div class="modal-actions"><button class="secondary" id="cancelAdd">Cancel</button><button class="small-btn" id="saveAdd">Save tracks</button></div>`,()=>{$('#cancelAdd').onclick=closeModal;$('#saveAdd').onclick=()=>{p.ids=$$('[data-pltrack]:checked').map(x=>Number(x.dataset.pltrack));save();closeModal();render();toast('Playlist updated')}})}})}
$('#sideNav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#mobileNav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b&&b.closest('.nav')!==$('#sideNav')&&b.closest('.mobile-nav')===null){go(b.dataset.page);return}let p=e.target.closest('[data-play]');if(p){playTrack(p.dataset.play);return}let l=e.target.closest('[data-like]');if(l){toggleLike(Number(l.dataset.like));return}let f=e.target.closest('[data-filter]');if(f){activeFilter=f.dataset.filter;page='library';render();return}if(e.target.closest('[data-import]')){$('#filePicker').click();return}let cardEl=e.target.closest('[data-track-card]');if(cardEl&&!e.target.closest('button')){playTrack(cardEl.dataset.trackCard);return}let g=e.target.closest('[data-goto]');if(g){go(g.dataset.goto);return}let pl=e.target.closest('[data-pl]');if(pl){showPlaylist(Number(pl.dataset.pl));return}if(e.target.id==='newPlaylist'||e.target.textContent.includes('Create playlist')){openModal(`<h3>Create a playlist</h3><p>Give your playlist a name. You can add tracks after creating it.</p><input id="playlistName" type="text" placeholder="e.g. Late night vibes" maxlength="50"><div class="modal-actions"><button class="secondary" id="cancelCreate">Cancel</button><button class="small-btn" id="confirmCreate">Create playlist</button></div>`,()=>{$('#cancelCreate').onclick=closeModal;$('#confirmCreate').onclick=()=>{const name=$('#playlistName').value.trim();if(!name){toast('Enter a playlist name');return}playlists.push({name,ids:[]});save();closeModal();render();toast('Playlist created')}})}});
$('#filePicker').addEventListener('change',e=>{addTracks(e.target.files);e.target.value=''});['importSide','importTop','importCard'].forEach(id=>$('#'+id).addEventListener('click',()=>$('#filePicker').click()));$('#searchInput').addEventListener('input',e=>{searchQuery=e.target.value;if(searchQuery)page='search';render()});$('#playBtn').onclick=()=>{if(!tracks.length){$('#filePicker').click();return}if(current<0){playTrack(tracks[0].id);return}if(audio.paused)audio.play().then(updatePlayer).catch(()=>{});else audio.pause();updatePlayer()};$('#nextBtn').onclick=next;$('#prevBtn').onclick=prev;$('#shuffleBtn').onclick=()=>{shuffle=!shuffle;updatePlayer();toast(shuffle?'Shuffle on':'Shuffle off')};$('#repeatBtn').onclick=()=>{repeat=!repeat;audio.loop=repeat;updatePlayer();toast(repeat?'Repeat current track on':'Repeat off')};$('#nowLike').onclick=()=>{if(tracks[current])toggleLike(tracks[current].id)};$('#volume').oninput=e=>audio.volume=Number(e.target.value);audio.volume=.8;audio.addEventListener('loadedmetadata',()=>{$('#duration').textContent=fmt(audio.duration);$('#seek').value=0});audio.addEventListener('timeupdate',()=>{if(audio.duration){$('#seek').value=audio.currentTime/audio.duration*1000;$('#currentTime').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration)}});$('#seek').addEventListener('input',e=>{if(audio.duration)audio.currentTime=Number(e.target.value)/1000*audio.duration});audio.addEventListener('ended',()=>{if(!repeat)next()});audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);audio.addEventListener('error',()=>toast('This audio file could not be played by your browser'));
$('#queueBtn').onclick=()=>{const list=tracks.slice();openModal(`<h3>Play queue</h3><p>Choose a track to play next.</p><div class="rowlist">${list.map(t=>row(t)).join('')||'<div class="empty">Your queue is empty.</div>'}</div><div class="modal-actions"><button class="secondary" id="closeQueue">Close</button></div>`,()=>$('#closeQueue').onclick=closeModal)};$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});$('#themeBtn').onclick=()=>{document.body.classList.toggle('light-mode');const light=document.body.classList.contains('light-mode');document.querySelector('meta[name=theme-color]').setAttribute('content',light?'#f5f5f5':'#080808');toast(light?'Pearl white theme enabled':'Midnight monochrome enabled')};
// Make imported file playback resilient to track duration metadata updates.
audio.addEventListener('loadedmetadata',()=>{if(tracks[current])tracks[current].duration=audio.duration||0});
render();
})();
</script></body></html>
